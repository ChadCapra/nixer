# Set prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Ensure new windows open in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Enable mouse (essential for resizing the services split)
set -g mouse on

# Renumber windows automatically when one is closed
set -g renumber-windows on


# 1. Use Vi mode
set-window-option -g mode-keys vi

# 2. Visual Mode (v) to start selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# 3. Yank (y) to system clipboard
# This command checks for wl-copy; if found, uses it. If not, uses xsel.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "if command -v wl-copy > /dev/null; then wl-copy; else xsel -ib; fi"

# 4. Paste (p) from system clipboard
bind-key p run "if command -v wl-paste > /dev/null; then wl-paste | tmux load-buffer - ; else xsel -ob | tmux load-buffer - ; fi; tmux paste-buffer"

# Prefix + f = Launch Sessionizer
bind-key f run-shell "tmux neww ~/nixer/bin/sessionizer"

# FORCE NUSHELL
# This ensures that new windows/panes always open Nushell, ignoring the system default (Bash).
set -g default-command "nu"
